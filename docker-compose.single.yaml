x-base: &base
  logging:
    driver: "json-file"
    options:
      max-size: "${MAX_LOG_FILE_SIZE:-10m}"
      max-file: "${MAX_LOG_FILE_COUNT:-3}"
      tag: "{{.Name}}|{{.ImageName}}|{{.ID}}"

x-mongo-node: &mongo-node
  <<: *base
  image: "mongo:${MONGO_VERSION:-latest}"
  restart: unless-stopped
  healthcheck:
    test:
      [
        "CMD-SHELL",
        "bash -c 'echo -en \"\\x00\\x00\\x00\\x00\" > /dev/tcp/localhost/27017'",
      ]
    interval: 30s
    timeout: 3s
    retries: 3
    start_period: 20s

services:
  mongo:
    <<: *mongo-node
    command: mongod --bind_ip_all --port 27017 --wiredTigerCacheSizeGB ${MONGO_WT_CACHE_SIZE_GB:-0.5}
    ports:
      - "${MONGO_BIND_ADDRESS:-127.0.0.1}:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    deploy:
      resources:
        limits:
          cpus: "${MONGO_CPU_LIMIT:-1.0}"
          memory: "${MONGO_MEM_LIMIT:-1G}"

  mongo-express:
    <<: *base
    image: "mongo-express:${MONGO_EXPRESS_VERSION:-latest}"
    restart: unless-stopped
    ports:
      - "${MONGO_EXPRESS_BIND_ADDRESS:-127.0.0.1}:${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH_ENABLED: false
      ME_CONFIG_BASICAUTH: false
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
