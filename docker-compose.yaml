x-base: &base
  volumes:
    - /etc/localtime:/etc/localtime:ro
  logging:
    driver: "json-file"
    options:
      max-size: "${MAX_LOG_FILE_SIZE:-10m}"
      max-file: "${MAX_LOG_FILE_COUNT:-3}"
      tag: "{{.Name}}|{{.ImageName}}|{{.ID}}"

x-mongo-node: &mongo-node
  <<: *base
  image: "mongo:${MONGO_VERSION:-latest}"
  restart: unless-stopped
  healthcheck:
    test:
      [
        "CMD-SHELL",
        "bash -c 'echo -en \"\\x00\\x00\\x00\\x00\" > /dev/tcp/localhost/27017'",
      ]
    interval: 30s
    timeout: 3s
    retries: 3
    start_period: 20s

x-mongo-config: &mongo-config
  <<: *mongo-node
  command: mongod --configsvr --replSet config --bind_ip_all --port 27017
  deploy:
    resources:
      limits:
        cpus: "${CONFIG_SVR_CPU_LIMIT:-0.7}"
        memory: "${CONFIG_SVR_MEM_LIMIT:-768M}"

x-mongo-shard-1: &mongo-shard-1
  <<: *mongo-node
  command: mongod --shardsvr --replSet shard1 --bind_ip_all --port 27017
  deploy:
    resources:
      limits:
        cpus: "${SHARD_SVR_CPU_LIMIT:-1.0}"
        memory: "${SHARD_SVR_MEM_LIMIT:-2G}"

x-mongo-shard-2: &mongo-shard-2
  <<: *mongo-node
  command: mongod --shardsvr --replSet shard2 --bind_ip_all --port 27017
  deploy:
    resources:
      limits:
        cpus: "${SHARD_SVR_CPU_LIMIT:-1.0}"
        memory: "${SHARD_SVR_MEM_LIMIT:-2G}"

services:
  mongo-config-1:
    <<: *mongo-config
    volumes:
      - mongo_config_1_db:/data/db
      - mongo_config_1_configdb:/data/configdb
  mongo-config-2:
    <<: *mongo-config
    volumes:
      - mongo_config_2_db:/data/db
      - mongo_config_2_configdb:/data/configdb
  mongo-config-3:
    <<: *mongo-config
    volumes:
      - mongo_config_3_db:/data/db
      - mongo_config_3_configdb:/data/configdb

  mongo-config-init:
    <<: *base
    image: "mongo:${MONGO_VERSION:-latest}"
    restart: on-failure
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        mongosh --host mongo-config-1 --eval '
        try {
          let status = rs.status();
          print("Config replica set already initialized:", status.ok === 1);
        } catch(e) {
          print("Initializing config replica set...");
          rs.initiate({
            _id: "config",
            configsvr: true,
            members: [
              { _id: 0, host: "mongo-config-1:27017" },
              { _id: 1, host: "mongo-config-2:27017" },
              { _id: 2, host: "mongo-config-3:27017" },
            ],
          });
        }'
    depends_on:
      mongo-config-1:
        condition: service_healthy
      mongo-config-2:
        condition: service_healthy
      mongo-config-3:
        condition: service_healthy

  mongo-shard-1-a:
    <<: *mongo-shard-1
    volumes:
      - mongo_shard_1_a_db:/data/db
  mongo-shard-1-b:
    <<: *mongo-shard-1
    volumes:
      - mongo_shard_1_b_db:/data/db
  mongo-shard-1-c:
    <<: *mongo-shard-1
    volumes:
      - mongo_shard_1_c_db:/data/db
  mongo-shard-1-init:
    <<: *base
    image: "mongo:${MONGO_VERSION:-latest}"
    restart: on-failure
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        mongosh --host mongo-shard-1-a --eval '
        try {
          let status = rs.status();
          print("Shard1 replica set already initialized:", status.ok === 1);
        } catch(e) {
          print("Initializing shard1 replica set...");
          rs.initiate({
            _id: "shard1",
            members: [
              { _id: 0, host: "mongo-shard-1-a:27017" },
              { _id: 1, host: "mongo-shard-1-b:27017" },
              { _id: 2, host: "mongo-shard-1-c:27017" },
            ],
          });
        }'
    depends_on:
      mongo-shard-1-a:
        condition: service_healthy
      mongo-shard-1-b:
        condition: service_healthy
      mongo-shard-1-c:
        condition: service_healthy

  mongo-shard-2-a:
    <<: *mongo-shard-2
    volumes:
      - mongo_shard_2_a_db:/data/db
  mongo-shard-2-b:
    <<: *mongo-shard-2
    volumes:
      - mongo_shard_2_b_db:/data/db
  mongo-shard-2-c:
    <<: *mongo-shard-2
    volumes:
      - mongo_shard_2_c_db:/data/db
  mongo-shard-2-init:
    <<: *base
    image: "mongo:${MONGO_VERSION:-latest}"
    restart: on-failure
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        mongosh --host mongo-shard-2-a --eval '
        try {
          let status = rs.status();
          print("Shard2 replica set already initialized:", status.ok === 1);
        } catch(e) {
          print("Initializing shard2 replica set...");
          rs.initiate({
            _id: "shard2",
            members: [
              { _id: 0, host: "mongo-shard-2-a:27017" },
              { _id: 1, host: "mongo-shard-2-b:27017" },
              { _id: 2, host: "mongo-shard-2-c:27017" },
            ],
          });
        }'
    depends_on:
      mongo-shard-2-a:
        condition: service_healthy
      mongo-shard-2-b:
        condition: service_healthy
      mongo-shard-2-c:
        condition: service_healthy

  mongos:
    <<: *mongo-node
    command: mongos --configdb config/mongo-config-1:27017,mongo-config-2:27017,mongo-config-3:27017 --bind_ip_all
    ports:
      - "${MONGOS_PORT:-27017}:27017"
    deploy:
      resources:
        limits:
          cpus: "${MONGOS_CPU_LIMIT:-0.5}"
          memory: "${MONGOS_MEM_LIMIT:-512M}"
    depends_on:
      mongo-config-init:
        condition: service_completed_successfully
      mongo-shard-1-init:
        condition: service_completed_successfully
      mongo-shard-2-init:
        condition: service_completed_successfully

  mongos-init:
    <<: *base
    image: "mongo:${MONGO_VERSION:-latest}"
    restart: on-failure
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        mongosh --host mongos --eval '
        try {
          let shardsInfo = sh.status().shards || [];
          let existingShards = shardsInfo.map(s => s._id);

          if (!existingShards.includes("shard1")) {
            sh.addShard("shard1/mongo-shard-1-a:27017,mongo-shard-1-b:27017,mongo-shard-1-c:27017");
          } else { print("shard1 already added"); }

          if (!existingShards.includes("shard2")) {
            sh.addShard("shard2/mongo-shard-2-a:27017,mongo-shard-2-b:27017,mongo-shard-2-c:27017");
          } else { print("shard2 already added"); }
        } catch(e) { print("Error adding shards:", e); }'

        shopt -s nullglob
        for f in /docker-entrypoint-initdb.d/*; do
          case "$$f" in
            *.sh) echo "$0: running $$f"; . "$$f" ;;
            *)    echo "$0: ignoring $$f" ;;
          esac
          echo
        done
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
    depends_on:
      mongos:
        condition: service_healthy

  mongo-express:
    <<: *base
    image: "mongo-express:${MONGO_EXPRESS_VERSION:-latest}"
    restart: unless-stopped
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongos:27017/
      ME_CONFIG_BASICAUTH_ENABLED: false
      ME_CONFIG_BASICAUTH: false
    depends_on:
      mongos-init:
        condition: service_completed_successfully

volumes:
  mongo_config_1_db:
  mongo_config_1_configdb:
  mongo_config_2_db:
  mongo_config_2_configdb:
  mongo_config_3_db:
  mongo_config_3_configdb:
  mongo_shard_1_a_db:
  mongo_shard_1_b_db:
  mongo_shard_1_c_db:
  mongo_shard_2_a_db:
  mongo_shard_2_b_db:
  mongo_shard_2_c_db:
